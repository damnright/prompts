services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: sql_learning
      POSTGRES_USER: sql_learner
      POSTGRES_PASSWORD: ${SQL_LEARNING_PASSWORD:?请先运行 python3 lab.py up 生成本地配置}
      TZ: UTC
    ports:
      - "127.0.0.1:${SQL_LEARNING_PORT:-55432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U sql_learner -d sql_learning"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
